<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anime Background Remover</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="theme-color" content="#3b6cf6" />
    <!-- Reloads the page once with COOP/COEP headers (GitHub Pages can't send them) so the CPU backend can use threads. -->
    <script src="coi-serviceworker.min.js"></script>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Anime Background Remover <span class="tag">beta</span></h1>
        <p class="sub">
          Cut out characters from anime and illustrations. Runs in your browser: your images never
          leave this device.
        </p>
      </header>

      <section class="card">
        <label id="drop" class="drop" for="file">
          <input id="file" type="file" accept="image/png,image/jpeg,image/webp" />
          <span id="drop-text">Drop or paste an image here, or <u>choose a file</u></span>
        </label>

        <div class="controls">
          <fieldset id="bg" class="bg">
            <legend>Background</legend>
            <label><input type="radio" name="bg" value="none" checked /> Transparent</label>
            <label><input type="radio" name="bg" value="white" /> White</label>
            <label
              ><input type="radio" name="bg" value="color" /> Color
              <input id="bg-color" type="color" value="#88ccff" aria-label="Background color"
            /></label>
            <label class="bg-image"
              ><input type="radio" name="bg" value="image" /> Image
              <input id="bg-file" type="file" accept="image/*" aria-label="Background image"
            /></label>
          </fieldset>
          <label
            >Format
            <select id="format">
              <option value="image/png">PNG</option>
              <option value="image/jpeg">JPG</option>
            </select>
          </label>
          <label
            >Run on
            <select id="backend">
              <option value="webgpu">GPU (WebGPU)</option>
              <option value="wasm">CPU (WASM)</option>
            </select>
          </label>
        </div>

        <progress id="progress" max="1" value="0" hidden></progress>
        <p id="status" role="status"></p>
      </section>

      <section id="result-card" class="card" hidden>
        <div class="result-bar">
          <button id="download">Download</button>
          <button id="compare" class="secondary">Hold to see original</button>
        </div>
        <div class="stage"><canvas id="preview" aria-label="Result preview"></canvas></div>
      </section>

      <details class="card env">
        <summary>This device</summary>
        <dl id="env-list">
          <dt>Status</dt>
          <dd>checking…</dd>
        </dl>
      </details>

      <footer class="foot">
        Made by <a href="https://cuisinecometwot.github.io/">Huu Duc Nguyen</a> ·
        <a href="https://github.com/cuisinecometwot/anime-bg-remover">Source on GitHub</a>
      </footer>
    </main>
  </body>
</html>
